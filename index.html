    <!-- PREMIUM SPLASH SCREEN STYLES -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: "Vazirmatn", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
      }
      
      @media (prefers-color-scheme: dark) {
        body { background-color: #030712; color: #f8fafc; }
      }

      /* Animated Mesh Background */
      #splash-screen {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background-color: #020617;
        background-image: 
          radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.4) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(13, 148, 136, 0.4) 0px, transparent 50%);
        background-size: 200% 200%;
        animation: gradientMove 8s ease infinite;
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
      }

      @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      #splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
        transform: scale(1.05);
      }

      /* Glassmorphism Card */
      .splash-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 45px 55px;
        border-radius: 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        animation: float 6s ease-in-out infinite;
      }

      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }

      /* Glowing Spinner */
      .premium-spinner {
        position: relative;
        width: 64px; height: 64px;
        margin-bottom: 28px;
      }

      .spinner-ring {
        position: absolute; inset: 0;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.1);
      }

      .spinner-active {
        position: absolute; inset: 0;
        border-radius: 50%;
        border: 4px solid transparent;
        border-top-color: #2dd4bf; /* Teal 400 */
        border-right-color: #818cf8; /* Indigo 400 */
        animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      }

      @keyframes spin { 
        0% { transform: rotate(0deg); } 
        100% { transform: rotate(360deg); } 
      }

      /* Text Animations & Styles */
      .splash-text-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: fadeUp 1s ease-out forwards;
      }

      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(15px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .splash-title {
        font-weight: 900;
        font-size: 2rem;
        margin-bottom: 8px;
        letter-spacing: -0.03em;
        text-shadow: 0 4px 20px rgba(45, 212, 191, 0.3);
        /* Gradient Text Magic */
        background: linear-gradient(135deg, #2dd4bf 0%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .splash-subtitle {
        color: rgba(255, 255, 255, 0.8);
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: 0px;
      }

      /* Noise Overlay for premium texture */
      .noise-overlay {
        position: absolute; inset: 0; z-index: -1;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        pointer-events: none;
      }

      .visually-hidden {
        position: absolute !important; width: 1px !important; height: 1px !important;
        padding: 0 !important; margin: -1px !important; overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important;
      }
    </style>

  <body>

        ⚠️ کی‌داره برای اجرا به JavaScript نیاز دارد. لطفاً آن را فعال کنید.

    <!-- PREMIUM SPLASH SCREEN -->

        </div>
      </div>

      <span class="visually-hidden">لطفاً منتظر بمانید. برنامه در حال بارگذاری است.</span>
    </div>

    <!-- REACT ROOT -->
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Splash Screen Removal Logic -->
    <script>
      window.addEventListener("load", () => {
        setTimeout(() => {
          const splash = document.getElementById("splash-screen");
          if (splash) {
            splash.classList.add("hidden");
            setTimeout(() => splash.remove(), 600);
          }
        }, 500); // زمان مکث کوتاه برای نمایش زیبایی صفحه لودینگ
      });
    </script>
