    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: "Vazirmatn", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background-color: #f9fafb;
        color: #111827;
        line-height: 1.6;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
      }

      #initial-loader {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: linear-gradient(135deg, #0f766e 0%, #0e7490 100%);
        z-index: 9999; transition: opacity .3s ease-out, visibility .3s ease-out;
      }
      #initial-loader.hidden { opacity: 0; visibility: hidden; }

      .loader-spinner {
        width: 56px; height: 56px; border: 5px solid rgba(255,255,255,.2);
        border-top: 5px solid #fff; border-radius: 50%;
        animation: spin 1s linear infinite; margin-bottom: 18px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .loader-text { color: #fff; font-weight: 900; font-size: 1.5rem; margin-bottom: 6px; }
      .loader-subtext { color: rgba(255,255,255,.88); font-size: .9rem; font-weight: 700; }

      .visually-hidden {
        position: absolute !important; width: 1px !important; height: 1px !important;
        padding: 0 !important; margin: -1px !important; overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important;
      }

      *:focus-visible { outline: 2px solid #0f766e; outline-offset: 2px; }
    </style>
  </head>

  <body>
    <noscript>
      <div
        style="position:fixed;top:0;left:0;right:0;background:#ef4444;color:#fff;padding:14px;text-align:center;font-weight:700;z-index:10000"
        role="alert"
      >
        ⚠️ این اپلیکیشن برای اجرا به JavaScript نیاز دارد. لطفاً آن را فعال کنید.
      </div>
    </noscript>

    <div id="root">
      <div id="initial-loader" role="status" aria-label="در حال بارگذاری اپلیکیشن">
        <div class="loader-spinner" aria-hidden="true"></div>
        <div class="loader-text">کی‌داره؟</div>
        <div class="loader-subtext">ببین کی داره؟ برو بگیر</div>
        <span class="visually-hidden">لطفاً منتظر بمانید. برنامه در حال بارگذاری است.</span>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      // فقط مدیریت لودر (ثبت SW در main.tsx انجام می‌شود)
      window.addEventListener("load", () => {
        setTimeout(() => {
          const loader = document.getElementById("initial-loader");
          if (loader) {
            loader.classList.add("hidden");
            setTimeout(() => loader.remove(), 300);
          }
        }, 350);
      });
    </script>
  </body>
