version: '3.8'

services:
  # Kidareh Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    image: kidareh:latest
    container_name: kidareh-app
    restart: unless-stopped
    
    ports:
      - "3000:3000"
    
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      # 🚨 بسیار مهم: مسیر دیتابیس را به ولوم مپ شده تغییر دادیم
      - DATABASE_URL=/data/app.db
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key-minimum-32-characters}
      - KAVENEGAR_API_KEY=${KAVENEGAR_API_KEY:-}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY:-}
      - PAYPING_TOKEN=${PAYPING_TOKEN:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
    
    volumes:
      # Persist database (حالا مسیر دیتابیس و ولوم یکی هستند)
      - database-data:/data
      # Persist uploads
      - uploads-data:/app/uploads
      # Persist logs
      - logs-data:/app/logs
      # Persist backups
      - backup-data:/app/backup
    
    networks:
      - kidareh-network
    
    # اصلاح Healthcheck برای استفاده از Node به جای curl
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    
    labels:
      - "com.kidareh.service=app"
      - "com.kidareh.version=1.0.0"

# Volumes (Data Persistence)
volumes:
  database-data:
    driver: local
  uploads-data:
    driver: local
  logs-data:
    driver: local
  backup-data:
    driver: local

# Networks
networks:
  kidareh-network:
    driver: bridge