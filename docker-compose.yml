version: '3.8'

services:
  # Kidareh Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    image: kidareh:latest
    container_name: kidareh-app
    restart: unless-stopped
    
    ports:
      - "3000:3000"
    
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key-minimum-32-characters}
      - KAVENEGAR_API_KEY=${KAVENEGAR_API_KEY:-}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY:-}
      - PAYPING_TOKEN=${PAYPING_TOKEN:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
    
    volumes:
      # Persist database
      - database-data:/data
      # Persist uploads
      - uploads-data:/app/uploads
      # Persist logs
      - logs-data:/app/logs
    
    networks:
      - kidareh-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    
    labels:
      - "com.kidareh.service=app"
      - "com.kidareh.version=1.0.0"

# Volumes (Data Persistence)
volumes:
  database-data:
    driver: local
  uploads-data:
    driver: local
  logs-data:
    driver: local

# Networks
networks:
  kidareh-network:
    driver: bridge