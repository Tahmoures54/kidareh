version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: kidareh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - kidareh-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    image: kidareh:latest
    container_name: kidareh-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=/data/app.db
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key-minimum-32-characters}
      - COOKIE_SECRET=${COOKIE_SECRET:-your-cookie-secret-minimum-32-chars}
      - KAVENEGAR_API_KEY=${KAVENEGAR_API_KEY:-}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PAYPING_TOKEN=${PAYPING_TOKEN:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - CACHE_TTL_SEARCH=${CACHE_TTL_SEARCH:-60}
      - CACHE_TTL_PRODUCT=${CACHE_TTL_PRODUCT:-120}
    volumes:
      - database-data:/data
      - uploads-data:/app/uploads
      - logs-data:/app/logs
      - backup-data:/app/backup
    networks:
      - kidareh-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - "com.kidareh.service=app"
      - "com.kidareh.version=1.0.0"

volumes:
  database-data:
    driver: local
  uploads-data:
    driver: local
  logs-data:
    driver: local
  backup-data:
    driver: local
  redis-data:
    driver: local

networks:
  kidareh-network:
    driver: bridge
