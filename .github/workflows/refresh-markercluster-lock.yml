name: Refresh Marker Cluster Dependency Lock

on:
  push:
    branches:
      - feat/buyer-experience-polish
    paths:
      - .github/workflows/refresh-markercluster-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add Leaflet marker clustering packages
        run: |
          npm install leaflet.markercluster --save --no-audit --no-fund
          npm install @types/leaflet.markercluster --save-dev --no-audit --no-fund
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Commit dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): add Leaflet marker clustering"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
