name: Flask Marketplace Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# توکن فقط read-only — این workflow چیزی نمی‌نویسد
permissions:
  contents: read

# اگر سریع چند push شد، اجرای قبلی لغو می‌شود
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # IMPORTANT: keep this in sync with runtime.txt / liara.json
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Production configuration preflight
        run: python scripts/check_production.py

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python
        # `scripts` is included so the maintenance and benchmark tools fail
        # the build on a syntax error like any shipped module.
        run: python -m compileall -q main.py wsgi.py gunicorn.conf.py kidareh tests scripts migrations

      - name: Check JavaScript syntax
        # Every script is checked, not a hand-maintained list: seller.js shipped
        # with a syntax error for several releases because it was not listed.
        run: |
          set -euo pipefail
          if [ -d static ]; then
            find static -name '*.js' -print0 | xargs -0 -n1 node --check
          else
            echo "::warning::No static/ directory found — skipping JS check"
          fi

      - name: Run tests
        run: python -m pytest -q --tb=short
        env:
          SECRET_KEY: test-secret-key-not-for-production
          FLASK_ENV: testing

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            .pytest_cache/
            *.log
          retention-days: 7
          if-no-files-found: ignore