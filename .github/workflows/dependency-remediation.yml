name: Temporary dependency remediation
on:
  push:
    branches:
      - audit/sprint1-storage-payment-safety
    paths:
      - .github/workflows/dependency-remediation.yml
permissions:
  contents: write
jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/sprint1-storage-payment-safety
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade Multer to supported major and regenerate lockfile
        run: |
          npm pkg set 'dependencies.multer=^2.0.2'
          npm install --package-lock-only --ignore-scripts
      - name: Apply compatible security updates
        run: |
          npm audit fix || true
          npm install --package-lock-only --ignore-scripts
      - name: Commit dependency remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes were produced."
            exit 0
          fi
          git add package.json package-lock.json
          git commit -m "security: remediate vulnerable npm dependencies"
          git push origin HEAD:audit/sprint1-storage-payment-safety
