name: Deploy Kidareh to Liara

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liara-production-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Test before deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # اطمینان حاصل کنید که این نسخه با runtime.txt هماهنگ است
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Production configuration preflight
        run: python scripts/check_production.py

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python
        run: python -m compileall -q main.py wsgi.py gunicorn.conf.py kidareh tests scripts migrations

      - name: Check JavaScript syntax
        run: |
          find static -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: python -m pytest -q

  deploy:
    name: Deploy to Liara
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          if [ ! -f "liaraignore" ] && [ ! -f ".gitignore" ]; then
            echo "::warning::Neither 'liaraignore' nor '.gitignore' found. Unnecessary files may be uploaded."
          fi
          # بررسی وجود متغیرهای ضروری
          if [ -z "${{ secrets.LIARA_API_TOKEN }}" ]; then
            echo "::error::LIARA_API_TOKEN secret is not set."
            exit 1
          fi
          if [ -z "${{ vars.LIARA_APP_NAME }}" ]; then
            echo "::error::LIARA_APP_NAME variable is not set."
            exit 1
          fi

      # روش پیشنهادی: استفاده از اکشن رسمی Liara
      - name: Deploy to Liara
        uses: liara-cloud/deploy@v1
        with:
          api-token: ${{ secrets.LIARA_API_TOKEN }}
          app-name: ${{ vars.LIARA_APP_NAME }}
          platform: python
          port: 3000
          # اگر اکشن از پارامتر disk پشتیبانی نمی‌کند، از روش CLI استفاده کنید
          # disk: "app-data:/app/data"