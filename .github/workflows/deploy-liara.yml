name: Deploy Kidareh to Liara

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liara-production-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Test before deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Keep this in sync with runtime.txt and the test workflow.
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Production configuration preflight
        run: python scripts/check_production.py

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python
        run: python -m compileall -q main.py wsgi.py gunicorn.conf.py kidareh tests scripts migrations

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find static -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: python -m pytest -q

  deploy:
    name: Deploy to Liara
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          LIARA_APP_NAME: ${{ vars.LIARA_APP_NAME }}
        run: |
          set -euo pipefail
          test -n "$LIARA_API_TOKEN" || {
            echo "::error::LIARA_API_TOKEN secret is not set."
            exit 1
          }
          test -n "$LIARA_APP_NAME" || {
            echo "::error::LIARA_APP_NAME repository/environment variable is not set."
            exit 1
          }
          test -f "liaraignore" || {
            echo "::error::liaraignore is missing."
            exit 1
          }

      - name: Set up Node.js for Liara CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install official Liara CLI
        run: npm install --global @liara/cli@9

      - name: Deploy to Liara
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          LIARA_APP_NAME: ${{ vars.LIARA_APP_NAME }}
        run: |
          set -euo pipefail
          liara deploy \
            --app="$LIARA_APP_NAME" \
            --api-token="$LIARA_API_TOKEN" \
            --platform=python \
            --port=3000 \
            --no-app-logs
