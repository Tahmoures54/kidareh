name: Refresh Official Iranian City Dataset

on:
  push:
    branches:
      - feat/buyer-experience-polish
    paths:
      - .github/workflows/refresh-iran-cities.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate the official city dataset
        run: node scripts/sync-iran-cities.mjs
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run typecheck
      - name: Test suite
        run: npm test
      - name: Commit generated city data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/raw/rawIranCitiesCompact0.ts src/data/raw/rawIranCitiesCompact1.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(location): restore complete Iranian city dataset"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
