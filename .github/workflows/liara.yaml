name: CD-Liara
on:
push:
  branches:
    - main
jobs:
deploy:
  runs-on: ubuntu-latest

  steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: "22"
    - name: update-liara
      env:
        LIARA_TOKEN: ${{ secrets.eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySUQiOiI2OGFkMzdmOGNjYTVlM2UwNjgwZTgzYzgiLCJ0eXBlIjoiYXV0aCIsImlhdCI6MTc4ODAyMTc0MCwiZXhwIjoxODE5NTc5MzQwfQ.Bb6WYMr4WlCnxKOVJztBJ53iZesAb_utYHPma3_9x-s }}
      run: |
        npm i -g @liara/cli@9
        liara deploy --app="APP_NAME" --api-token="$LIARA_TOKEN" --no-app-logs
