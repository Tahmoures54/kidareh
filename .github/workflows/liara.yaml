name: CD-Liara

on:
  push:
    branches:
      - main
    # فقط تغییرات مؤثر بر برنامه استقرار ایجاد می‌کنند؛
    # تغییر مستندات و فایل‌های فرایند توسعه سهمیه Liara را مصرف نمی‌کند.
    paths:
      - "src/**"
      - "server/**"
      - "public/**"
      - "scripts/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "index.html"
      - "liara.json"
      - "Dockerfile"
      - ".env.example"

concurrency:
  group: liara-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Liara CLI
        run: npm install --global @liara/cli@9

      - name: Deploy to Liara
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          liara deploy --app="kidareh" --api-token="$LIARA_TOKEN" --port=3000 --no-app-logs --detach
