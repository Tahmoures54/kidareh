name: CD-Liara
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # اپدیت شده به نسخه جدیدتر
        
      - name: Setup Node.js
        uses: actions/setup-node@v4 # اپدیت شده به نسخه جدیدتر
        with:
          node-version: "22"
          
      - name: Deploy to Liara
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          npm i -g @liara/cli@9
          liara deploy --app="kidareh" --api-token="$LIARA_TOKEN" --no-app-logs
